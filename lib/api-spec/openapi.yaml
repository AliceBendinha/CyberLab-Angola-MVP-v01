openapi: 3.1.0
info:
  # Do not change the title, if the title changes, the import paths will be broken
  title: Api
  version: 0.1.0
  description: API specification
servers:
  - url: /api
    description: Base API path
tags:
  - name: health
    description: Health operations
  - name: auth
    description: User authentication and session operations
  - name: authorization
    description: Temporary role access checks
  - name: students
    description: Student-owned profile and progress
  - name: learning
    description: Published learning modules and mission attempts
  - name: diagnostic
    description: Initial, non-certifying learning diagnostic
paths:
  /health:
    get:
      operationId: getApiHealth
      tags: [health]
      summary: CyberLab Angola API health check
      description: Returns the health status of the CyberLab Angola API
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiHealth"
  /healthz:
    get:
      operationId: healthCheck
      tags: [health]
      summary: Health check
      description: Returns server health status
      responses:
        "200":
          description: Healthy
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthStatus"
  /auth/register:
    post:
      operationId: registerAuthUser
      tags: [auth]
      summary: Create a student account
      description: Creates a public STUDENT account and starts a secure session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterInput"
      responses:
        "201":
          description: Account created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid registration input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "409":
          description: Email already registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many registration attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/login:
    post:
      operationId: loginAuthUser
      tags: [auth]
      summary: Sign in
      description: Validates credentials and starts a secure session.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginInput"
      responses:
        "200":
          description: Signed in
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "400":
          description: Invalid login input
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "429":
          description: Too many login attempts
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/me:
    get:
      operationId: getAuthMe
      tags: [auth]
      summary: Get the current authenticated user
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current authenticated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AuthUser"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /auth/logout:
    post:
      operationId: logoutAuthUser
      tags: [auth]
      summary: End the current session
      description: Invalidates the session cookie when present and clears it.
      responses:
        "204":
          description: Session ended
  /test/student:
    get:
      operationId: getStudentRoleTest
      tags: [authorization]
      summary: Verify authenticated access for every role
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authenticated access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /test/instructor:
    get:
      operationId: getInstructorRoleTest
      tags: [authorization]
      summary: Verify instructor or administrator access
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authorized access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /test/admin:
    get:
      operationId: getAdminRoleTest
      tags: [authorization]
      summary: Verify administrator-only access
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Authorized access granted
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TestAccessResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Insufficient role
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /students/me:
    get:
      operationId: getStudentMe
      tags: [students]
      summary: Get the authenticated student's own profile
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Current student's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    patch:
      operationId: updateStudentMe
      tags: [students]
      summary: Update the authenticated student's display name
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StudentProfileUpdate"
      responses:
        "200":
          description: Updated student's profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProfile"
        "400":
          description: Invalid profile update
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /modules:
    get:
      operationId: listLearningModules
      tags: [learning]
      summary: List published learning modules and the current student's progress
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Published modules with the authenticated student's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningModuleListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /modules/{slug}:
    get:
      operationId: getLearningModule
      tags: [learning]
      summary: Get one published module
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Published module and current student's progress
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LearningModuleSummary"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /modules/{slug}/missions:
    get:
      operationId: listModuleMissions
      tags: [learning]
      summary: List published missions in a published module
      security:
        - sessionCookie: []
      parameters:
        - name: slug
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Published mission summaries for the current student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ModuleMissionListResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Module not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /missions/{id}:
    get:
      operationId: getLearningMission
      tags: [learning]
      summary: Get a published mission without its answer key or explanation
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: Mission prompt and safe answer options
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionDetailResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /missions/{id}/attempts:
    get:
      operationId: listMissionAttempts
      tags: [learning]
      summary: List only the authenticated student's attempts for a mission
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      responses:
        "200":
          description: The current student's attempt history
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionAttemptHistoryResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
    post:
      operationId: submitMissionAttempt
      tags: [learning]
      summary: Submit and score an answer on the server
      security:
        - sessionCookie: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            minLength: 1
            maxLength: 120
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/MissionAttemptInput"
      responses:
        "201":
          description: Evaluated attempt with pedagogical feedback
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MissionAttemptResult"
        "400":
          description: Invalid answer
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Mission not found or unpublished
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /students/me/progress:
    get:
      operationId: getStudentProgress
      tags: [students]
      summary: Get the authenticated student's progress and learning history
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Progress and history belonging to the current student
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/StudentProgressResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /diagnostic:
    get:
      operationId: getInitialDiagnostic
      tags: [diagnostic]
      summary: Get the initial non-certifying knowledge diagnostic
      security:
        - sessionCookie: []
      responses:
        "200":
          description: Diagnostic questions without correct answers or explanations
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticQuestionsResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /diagnostic/submit:
    post:
      operationId: submitInitialDiagnostic
      tags: [diagnostic]
      summary: Evaluate and record a diagnostic attempt
      security:
        - sessionCookie: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DiagnosticSubmissionInput"
      responses:
        "201":
          description: Estimated level and recommended starting module
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DiagnosticResultResponse"
        "400":
          description: Invalid or incomplete diagnostic answers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Student role required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: cyberlab_session
  schemas:
    ApiHealth:
      type: object
      properties:
        status:
          type: string
          const: ok
        service:
          type: string
          const: CyberLab Angola API
      required:
        - status
        - service
    HealthStatus:
      type: object
      properties:
        status:
          type: string
      required:
        - status
    UserRole:
      type: string
      enum: [STUDENT, INSTRUCTOR, ADMIN]
    AuthUser:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        role:
          $ref: "#/components/schemas/UserRole"
      required: [id, name, email, role]
    RegisterInput:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 8
          maxLength: 72
      required: [name, email, password]
    LoginInput:
      type: object
      additionalProperties: false
      properties:
        email:
          type: string
          format: email
          maxLength: 254
        password:
          type: string
          minLength: 1
          maxLength: 72
      required: [email, password]
    ErrorResponse:
      type: object
      additionalProperties: false
      properties:
        error:
          type: string
      required: [error]
    TestAccessResponse:
      type: object
      additionalProperties: false
      properties:
        ok:
          type: boolean
          const: true
      required: [ok]
    LearningLevel:
      type: string
      enum: [BEGINNER, ELEMENTARY, INTERMEDIATE]
    MissionDifficulty:
      type: string
      enum: [EASY, MEDIUM, HARD]
    StudentProfile:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        name:
          type: string
        email:
          type: string
          format: email
        learningLevel:
          $ref: "#/components/schemas/LearningLevel"
        diagnosticCompleted:
          type: boolean
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - id
        - name
        - email
        - learningLevel
        - diagnosticCompleted
        - createdAt
        - updatedAt
    StudentProfileUpdate:
      type: object
      additionalProperties: false
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 120
      required: [name]
    MissionAnswerOption:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
      required: [id, text]
    ModuleProgress:
      type: object
      additionalProperties: false
      properties:
        completedMissions:
          type: integer
          minimum: 0
        totalMissions:
          type: integer
          minimum: 0
        pointsEarned:
          type: integer
          minimum: 0
        pointsAvailable:
          type: integer
          minimum: 0
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        lastActivityAt:
          type: [string, "null"]
          format: date-time
      required:
        - completedMissions
        - totalMissions
        - pointsEarned
        - pointsAvailable
        - completionPercent
        - lastActivityAt
    LearningModuleSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        order:
          type: integer
        missionCount:
          type: integer
          minimum: 0
        progress:
          $ref: "#/components/schemas/ModuleProgress"
      required: [id, title, slug, description, order, missionCount, progress]
    LearningModuleListResponse:
      type: array
      items:
        $ref: "#/components/schemas/LearningModuleSummary"
    MissionSummary:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        difficulty:
          $ref: "#/components/schemas/MissionDifficulty"
        points:
          type: integer
          minimum: 0
        order:
          type: integer
        attemptCount:
          type: integer
          minimum: 0
        isCompleted:
          type: boolean
        bestScore:
          type: [integer, "null"]
          minimum: 0
        lastAttemptAt:
          type: [string, "null"]
          format: date-time
      required:
        - id
        - title
        - slug
        - description
        - difficulty
        - points
        - order
        - attemptCount
        - isCompleted
        - bestScore
        - lastAttemptAt
    ModuleMissionListResponse:
      type: array
      items:
        $ref: "#/components/schemas/MissionSummary"
    MissionDetailResponse:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        moduleId:
          type: string
        title:
          type: string
        slug:
          type: string
        description:
          type: string
        scenario:
          type: string
        instructions:
          type: string
        question:
          type: string
        answerOptions:
          type: array
          items:
            $ref: "#/components/schemas/MissionAnswerOption"
        difficulty:
          $ref: "#/components/schemas/MissionDifficulty"
        points:
          type: integer
          minimum: 0
        order:
          type: integer
        attemptCount:
          type: integer
          minimum: 0
        isCompleted:
          type: boolean
        bestScore:
          type: [integer, "null"]
          minimum: 0
      required:
        - id
        - moduleId
        - title
        - slug
        - description
        - scenario
        - instructions
        - question
        - answerOptions
        - difficulty
        - points
        - order
        - attemptCount
        - isCompleted
        - bestScore
    MissionAttemptInput:
      type: object
      additionalProperties: false
      properties:
        submittedAnswer:
          type: string
          minLength: 1
          maxLength: 120
      required: [submittedAnswer]
    MissionAttemptResult:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        missionId:
          type: string
        submittedAnswerText:
          type: string
        isCorrect:
          type: boolean
        score:
          type: integer
          minimum: 0
        maxScore:
          type: integer
          minimum: 0
        attemptNumber:
          type: integer
          minimum: 1
        feedback:
          type: string
        explanation:
          type: string
        completedAt:
          type: string
          format: date-time
      required:
        - id
        - missionId
        - submittedAnswerText
        - isCorrect
        - score
        - maxScore
        - attemptNumber
        - feedback
        - explanation
        - completedAt
    MissionAttemptRecord:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        missionId:
          type: string
        missionTitle:
          type: string
        submittedAnswerText:
          type: string
        isCorrect:
          type: boolean
        score:
          type: integer
          minimum: 0
        attemptNumber:
          type: integer
          minimum: 1
        startedAt:
          type: string
          format: date-time
        completedAt:
          type: string
          format: date-time
      required:
        - id
        - missionId
        - missionTitle
        - submittedAnswerText
        - isCorrect
        - score
        - attemptNumber
        - startedAt
        - completedAt
    MissionAttemptHistoryResponse:
      type: array
      items:
        $ref: "#/components/schemas/MissionAttemptRecord"
    StudentProgressResponse:
      type: object
      additionalProperties: false
      properties:
        learningLevel:
          $ref: "#/components/schemas/LearningLevel"
        completedMissions:
          type: integer
          minimum: 0
        totalMissions:
          type: integer
          minimum: 0
        pointsEarned:
          type: integer
          minimum: 0
        pointsAvailable:
          type: integer
          minimum: 0
        completionPercent:
          type: integer
          minimum: 0
          maximum: 100
        modules:
          type: array
          items:
            $ref: "#/components/schemas/LearningModuleSummary"
        recentAttempts:
          type: array
          items:
            $ref: "#/components/schemas/MissionAttemptRecord"
        diagnosticHistory:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticHistoryRecord"
      required:
        - learningLevel
        - completedMissions
        - totalMissions
        - pointsEarned
        - pointsAvailable
        - completionPercent
        - modules
        - recentAttempts
        - diagnosticHistory
    DiagnosticQuestionOption:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        text:
          type: string
      required: [id, text]
    DiagnosticQuestion:
      type: object
      additionalProperties: false
      properties:
        id:
          type: string
        topic:
          type: string
        question:
          type: string
        options:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticQuestionOption"
      required: [id, topic, question, options]
    DiagnosticQuestionsResponse:
      type: object
      additionalProperties: false
      properties:
        title:
          type: string
        introduction:
          type: string
        totalQuestions:
          type: integer
          minimum: 1
        questions:
          type: array
          items:
            $ref: "#/components/schemas/DiagnosticQuestion"
      required: [title, introduction, totalQuestions, questions]
    DiagnosticAnswerInput:
      type: object
      additionalProperties: false
      properties:
        questionId:
          type: string
        selectedOptionId:
          type: string
      required: [questionId, selectedOptionId]
    DiagnosticSubmissionInput:
      type: object
      additionalProperties: false
      properties:
        answers:
          type: array
          minItems: 10
          maxItems: 10
          items:
            $ref: "#/components/schemas/DiagnosticAnswerInput"
      required: [answers]
    RecommendedModule:
      type: object
      additionalProperties: false
      properties:
        slug:
          type: string
        title:
          type: string
      required: [slug, title]
    DiagnosticResultResponse:
      type: object
      additionalProperties: false
      properties:
        attemptId:
          type: string
        score:
          type: integer
          minimum: 0
          maximum: 100
        correctAnswers:
          type: integer
          minimum: 0
        totalQuestions:
          type: integer
          minimum: 1
        learningLevel:
